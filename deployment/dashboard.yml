---
version: "3.5"

services:
  dashboard:
    image: ${DASHBOARD_IMAGE}
    secrets:
      - source: SUI_BRIDGE_POSTGRES_URL
        target: /run/secrets/sui-bridge-postgres-url
      - source: SUI_BRIDGE_TESTNET_POSTGRES_URL
        target: /run/secrets/sui-bridge-testnet-postgres-url
    networks:
      - net
      # Attached so the ai-tools LB (suianalytics.io vhost) can reach this
      # service via overlay DNS as `sui_bridge_dashboard:3000`.
      - load_balancer_net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname==moonlet-aiswarm-worker-01

networks:
  net:
    driver: overlay
  load_balancer_net:
    external: true

secrets:
  SUI_BRIDGE_POSTGRES_URL:
    external: true
  SUI_BRIDGE_TESTNET_POSTGRES_URL:
    external: true
